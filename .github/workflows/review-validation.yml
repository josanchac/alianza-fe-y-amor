name: Validate review in isolated PostgreSQL
on:
  push:
    branches: [review/guided-methodology]
  pull_request:
    paths: ['supabase/**', 'tests/**', 'package*.json', '.github/workflows/review-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: review-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: alianza_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALIANZA_TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/alianza_ci
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: isolated-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify documentary evidence and reviewed content
        run: npm run verify:methodology
      - name: Exercise real concurrent transactions
        run: node tests/postgres-concurrency.mjs
      - name: Rehearse backup and restore of synthetic data
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump -U postgres -Fc alianza_ci > /tmp/alianza-synthetic.dump
          docker exec ${{ job.services.postgres.id }} createdb -U postgres alianza_restore
          docker exec -i ${{ job.services.postgres.id }} pg_restore -U postgres --exit-on-error -d alianza_restore < /tmp/alianza-synthetic.dump
          node tests/postgres-restore.mjs
      - run: npm run build
      - name: Preserve verification evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-postgres-evidence
          path: test-results/*.json
          if-no-files-found: ignore
          retention-days: 14
  auth-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Start disposable Auth, API and database
        run: |
          npx --yes supabase@2.117.0 start --workdir tests/auth-stack -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > /tmp/alianza-auth-start.log 2>&1
          npx --yes supabase@2.117.0 status --workdir tests/auth-stack -o json > /tmp/alianza-auth-status.json
      - name: Exercise real JWT and API permissions
        env:
          ALIANZA_AUTH_STATUS_FILE: /tmp/alianza-auth-status.json
        run: node tests/auth-api.mjs
      - name: Check isolated database security advisors
        run: npx --yes supabase@2.117.0 db advisors --local --workdir tests/auth-stack --type security --fail-on error --output-format json > test-results/auth-security-advisors.json
      - name: Preserve verification evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-auth-api-evidence
          path: test-results/auth-*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove disposable stack and credentials
        if: always()
        run: |
          npx --yes supabase@2.117.0 stop --workdir tests/auth-stack --no-backup > /tmp/alianza-auth-stop.log 2>&1
          rm -f /tmp/alianza-auth-status.json /tmp/alianza-auth-start.log /tmp/alianza-auth-stop.log
