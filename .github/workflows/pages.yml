name: Verify and publish Alianza
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Require documented Schoenstatt methodology review before publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npm run verify:methodology
      - name: Require public deployment configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const saved=JSON.parse(readFileSync('github/config.public.json','utf8'));
          const url=process.env.SUPABASE_URL || saved.url;
          const publishableKey=process.env.SUPABASE_PUBLISHABLE_KEY || saved.publishableKey;
          if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url||'') || !publishableKey?.startsWith('sb_publishable_')) {
            throw new Error('Configure Supabase and the two accounts before publishing. Public project variables are missing or invalid.');
          }
          writeFileSync('github/config.local.json',JSON.stringify({...saved,url,publishableKey}));
          JS
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: github-dist
  invitation-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Start disposable Auth, API and database
        run: |
          npx --yes supabase@2.117.0 start --workdir tests/auth-stack -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > /tmp/alianza-auth-start.log 2>&1
          npx --yes supabase@2.117.0 status --workdir tests/auth-stack -o json > /tmp/alianza-auth-status.json
      - name: Exercise real JWT and API permissions
        env:
          ALIANZA_AUTH_STATUS_FILE: /tmp/alianza-auth-status.json
        run: node --import tsx tests/invitations-auth.mjs
      - name: Check isolated database security advisors
        run: npx --yes supabase@2.117.0 db advisors --local --workdir tests/auth-stack --type security --fail-on error --output-format json > test-results/auth-security-advisors.json
      - name: Preserve verification evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-auth-evidence
          path: test-results/*auth*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove disposable stack and credentials
        if: always()
        run: |
          npx --yes supabase@2.117.0 stop --workdir tests/auth-stack --no-backup > /tmp/alianza-auth-stop.log 2>&1
          rm -f /tmp/alianza-auth-status.json /tmp/alianza-auth-start.log /tmp/alianza-auth-stop.log

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, invitation-auth]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
