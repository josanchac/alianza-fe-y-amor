name: Verify and publish Alianza
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Require documented Schoenstatt methodology review before publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npm run verify:methodology
      - name: Require public deployment configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const saved=JSON.parse(readFileSync('github/config.public.json','utf8'));
          const url=process.env.SUPABASE_URL || saved.url;
          const publishableKey=process.env.SUPABASE_PUBLISHABLE_KEY || saved.publishableKey;
          if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url||'') || !publishableKey?.startsWith('sb_publishable_')) {
            throw new Error('Configure Supabase and the two accounts before publishing. Public project variables are missing or invalid.');
          }
          writeFileSync('github/config.local.json',JSON.stringify({...saved,url,publishableKey}));
          JS
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: github-dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
